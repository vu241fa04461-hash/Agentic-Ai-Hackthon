name: roadmind_ai
description: "Urban Pothole & Micro-Flooding GIS Intelligence System built with Flutter and Stitch AI design workflows."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^5.1.0
  lucide_icons: ^0.257.0
  flutter_map: ^6.0.0
  latlong2: ^0.9.0
  fl_chart: ^0.63.0
  provider: ^6.0.5
  image_picker: ^1.0.4
  csv: ^5.0.2
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - stitch/stitch_design_tokens.json
